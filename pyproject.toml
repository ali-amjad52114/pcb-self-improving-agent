[project]
name = "pcb-self-improving-agent"
version = "0.1.0"
description = "Person 3 LangGraph orchestrator for a self-improving PCB defect classification agent"
readme = "README.md"
authors = [
    { name = "wh0am1", email = "48444630+wh0th3h3llam1@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "elevenlabs>=1.50",
    "httpx>=0.28.1",
    "kagglehub>=0.3.13",
    "langchain>=0.3",
    "langchain-mongodb>=0.6",
    "langchain-openai>=0.3",
    "langchain-voyageai>=0.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "numpy>=2.0",
    "pillow>=11.0",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.27.1",
    "voyageai>=0.3",
]

[project.scripts]
pcb-agent = "pcb_agent.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcb_agent", "pcb_memory", "fireworks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
